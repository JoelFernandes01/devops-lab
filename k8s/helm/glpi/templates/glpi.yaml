---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi-app
  template:
    metadata:
      labels:
        app: glpi-app
    spec:
      containers:
      - name: glpi
        image: {{ .Values.glpi.image }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: glpi-storage
          mountPath: /var/www/html
      volumes:
      - name: glpi-storage
        persistentVolumeClaim:
          claimName: glpi-app-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-svc
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: glpi-app
