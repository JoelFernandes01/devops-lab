apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.global.namespace }}
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.{{ .Values.global.namespace }}.svc.cluster.local:9090
        isDefault: true

      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://alertmanager-service.{{ .Values.global.namespace }}.svc.cluster.local:9093

      - name: Zabbix
        type: alexanderzobnin-zabbix-datasource
        access: proxy
        url: {{ .Values.zabbixIntegration.url }}
        jsonData:
          username: "Admin"
