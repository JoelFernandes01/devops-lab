apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-files-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
  namespace: default
  labels:
    app: glpi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi-app
  template:
    metadata:
      labels:
        app: glpi-app
    spec:
      containers:
      - name: glpi
        image: lscr.io/linuxserver/glpi:latest
        ports:
        - containerPort: 80
        env:
        - name: TIMEZONE
          value: "America/Sao_Paulo"
        volumeMounts:
        - name: glpi-files
          mountPath: /var/www/html/files
      volumes:
      - name: glpi-files
        persistentVolumeClaim:
          claimName: glpi-files-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: glpi-app

