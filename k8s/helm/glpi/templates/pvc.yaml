---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-mariadb-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mariadb.storageSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-app-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.glpi.storageSize }}
