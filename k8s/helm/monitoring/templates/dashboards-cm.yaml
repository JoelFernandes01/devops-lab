---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.global.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  # Provider de configuração do Grafana
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'GitOps Dashboards'
        orgId: 1
        folder: 'Kubernetes & Zabbix'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards

  # Dashboard JSON 1: Node Exporter / Cluster K8s
  k8s-nodes.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "title": "Kubernetes Cluster Overview",
      "uid": "k8s-cluster-overview",
      "panels": []
    }
