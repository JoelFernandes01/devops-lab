---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi-app
  template:
    metadata:
      labels:
        app: glpi-app
    spec:
      containers:
      - name: glpi
        image: {{ .Values.glpi.image }}
        ports:
        - containerPort: 80
          command: ["/bin/bash", "-c"]
        args:
        - |
          # 1. Aguarda o MariaDB aceitar conexões e realiza a instalação automática do banco
          until php bin/console db:install --db-host=glpi-mariadb --db-name={{ .Values.mariadb.database }} --db-user=root --db-password={{ .Values.mariadb.rootPassword }} --force --no-interaction; do
            echo "Aguardando o MariaDB inicializar..."
            sleep 5
          done
          
          # 2. Inicia o servidor web do GLPI
          apache2-foreground
        volumeMounts:
        - name: glpi-storage
          mountPath: /var/www/html
      volumes:
      - name: glpi-storage
        persistentVolumeClaim:
          claimName: glpi-app-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-svc
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: glpi-app
