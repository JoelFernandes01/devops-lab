---
ingress:
  enabled: true
  className: "traefik"
  host: monitoring.nverse.local

zabbixWeb:
  image: zabbix/zabbix-web-nginx-mysql:alpine-latest
  port: 8080

zabbixServer:
  image: zabbix/zabbix-server-mysql:alpine-latest
  port: 10051

zabbixAgent:
  image: zabbix/zabbix-agent2:alpine-latest
  port: 10050
  
db:
  image: mariadb:10.11
  database: zabbix
  user: zabbix
  password: zabbix_password
  rootPassword: root_password
  storageSize: 5Gi
