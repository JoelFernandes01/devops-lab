---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glpi-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: glpi.nverse.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: glpi-svc
            port:
              number: 80
