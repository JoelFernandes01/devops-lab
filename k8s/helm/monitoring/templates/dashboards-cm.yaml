apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.global.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'GitOps-Dashboards'
        orgId: 1
        folder: 'Kubernetes & Zabbix'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards

  k8s-cluster-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Status do Cluster K8s",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(up{job=\"kubernetes-nodes\"})",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Total de Pods Em Execução",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "Uso Global de CPU",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "Uso Global de Memória",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)))",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "title": "Uso de CPU por Nó (Node Exporter)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "100 - (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]) * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "title": "Consumo de Memória RAM por Pod",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["kubernetes", "prometheus"],
      "title": "Kubernetes - Cluster & Workloads Overview",
      "uid": "k8s-cluster-overview"
    }

  zabbix-infra-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "title": "Total de Hosts Monitorados (Zabbix)",
          "type": "stat",
          "datasource": { "type": "alexanderzobnin-zabbix-datasource", "uid": "Zabbix" },
          "targets": [
            {
              "group": { "filter": "/.*/" },
              "host": { "filter": "/.*/" },
              "item": { "filter": "/.*/" },
              "mode": 0,
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "title": "Tráfego de Rede (Zabbix Hosts)",
          "type": "timeseries",
          "datasource": { "type": "alexanderzobnin-zabbix-datasource", "uid": "Zabbix" },
          "targets": [
            {
              "group": { "filter": "Linux servers" },
              "host": { "filter": "/.*/" },
              "item": { "filter": "/Interface .* Incoming traffic/" },
              "mode": 0,
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "title": "Alertas Ativos (Zabbix)",
          "type": "stat",
          "datasource": { "type": "alexanderzobnin-zabbix-datasource", "uid": "Zabbix" },
          "targets": [
            {
              "group": { "filter": "/.*/" },
              "host": { "filter": "/.*/" },
              "application": { "filter": "/.*/" },
              "trigger": { "filter": "/.*/" },
              "mode": 2,
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["zabbix", "infrastructure"],
      "title": "Zabbix - Infraestrutura & Agentes",
      "uid": "zabbix-infra-overview"
    }
