apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.global.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'GitOps-Dashboards'
        orgId: 1
        folder: 'Kubernetes & Zabbix'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards

  k8s-nodes-health.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Status do Cluster K8s",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(up{job='kubernetes-nodes'})",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Total de Pods Em Execucao",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase='Running'})",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "Uso Global de CPU",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "Uso Global de Memoria",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)))",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "title": "Uso de CPU por No (Node Exporter)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "100 - (rate(node_cpu_seconds_total{mode='idle'}[5m]) * 100)",
              "legendFormat": "{{ "{{" }}instance{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "title": "Consumo de Memoria RAM por Pod",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod!=''}) by (pod)",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["kubernetes", "prometheus"],
      "title": "Kubernetes - Nodes & Cluster Health",
      "uid": "k8s-nodes-health"
    }

  k8s-workloads-detail.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "title": "Total de Deployments",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "count(kube_deployment_created)",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "title": "Pods com Restarts Recentes",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "title": "Pods Nao Saudaveis (Failed / Pending)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=~'Failed|Pending'})",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "id": 4,
          "title": "Uso de CPU por Pod (mcores)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod!=''}[5m])) by (pod) * 1000",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["kubernetes", "workloads"],
      "title": "Kubernetes - Workloads & Pods Detail",
      "uid": "k8s-workloads-detail"
    }

  zabbix-infra-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Status dos Agentes Zabbix (VMs)",
          "type": "stat",
          "datasource": { "type": "alexanderzobnin-zabbix-datasource", "uid": "Zabbix" },
          "targets": [
            {
              "group": { "filter": "/.*/" },
              "host": { "filter": "/.*/" },
              "item": { "filter": "Agent ping" },
              "mode": 0,
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Uso de CPU Global por VM (Zabbix Agent)",
          "type": "timeseries",
          "datasource": { "type": "alexanderzobnin-zabbix-datasource", "uid": "Zabbix" },
          "targets": [
            {
              "group": { "filter": "/.*/" },
              "host": { "filter": "/.*/" },
              "item": { "filter": "/CPU utilization|System load/" },
              "mode": 0,
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["zabbix", "infrastructure"],
      "title": "Zabbix - Hosts & Infraestrutura",
      "uid": "zabbix-infra-overview"
    }

  zabbix-alerts.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Triggers e Alertas Ativos no Zabbix",
          "type": "alexanderzobnin-zabbix-triggers-panel",
          "datasource": { "type": "alexanderzobnin-zabbix-datasource", "uid": "Zabbix" },
          "targets": [
            {
              "group": { "filter": "/.*/" },
              "host": { "filter": "/.*/" },
              "application": { "filter": "/.*/" },
              "trigger": { "filter": "/.*/" },
              "mode": 0,
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["zabbix", "alerts"],
      "title": "Zabbix - Alertas & Triggers em Tempo Real",
      "uid": "zabbix-alerts"
    }
